[package]
name = "consumer_engine-server"
description = "Binary wiring the consumer engine crates into a running service"
version.workspace = true
authors.workspace = true
edition.workspace = true
license.workspace = true
documentation.workspace = true
repository.workspace = true
homepage.workspace = true

[features]
default = []
# Forward the semantic-llm feature: real HTTP LLM/embedding clients (spec 13 §4).
semantic-llm = ["consumer_engine-semantic/semantic-llm"]
ingestion-cdc = ["consumer_engine-ingestion/ingestion-cdc"]

[dependencies]
consumer_engine-core.workspace = true
consumer_engine-storage.workspace = true
consumer_engine-execution.workspace = true
consumer_engine-ingestion.workspace = true
consumer_engine-ingress.workspace = true
consumer_engine-query.workspace = true
consumer_engine-semantic.workspace = true
getrandom.workspace = true
anyhow.workspace = true
tokio.workspace = true
axum.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true

[dev-dependencies]
reqwest = { version = "0.12", features = ["json"] }
tempfile = "3"
tokio.workspace = true
serde_json.workspace = true
bytes = "1"
arrow = "58"
parquet = { version = "58", default-features = false, features = ["arrow", "snap"] }
uuid = { workspace = true }
chrono.workspace = true
