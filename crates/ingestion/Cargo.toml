[package]
name = "consumer_engine-ingestion"
description = "Single-writer ingestion actor: batch ingest, micro-batch, compaction, Feature Store producers"
categories = ["development-tools"]
keywords = ["ingestion", "actor", "feature-store"]
version.workspace = true
authors.workspace = true
edition.workspace = true
license.workspace = true
documentation.workspace = true
repository.workspace = true
homepage.workspace = true

[dependencies]
consumer_engine-core.workspace = true
consumer_engine-storage.workspace = true
consumer_engine-execution.workspace = true
async-trait.workspace = true
dashmap.workspace = true
duckdb.workspace = true
flume.workspace = true
chrono.workspace = true
serde_json.workspace = true
tracing.workspace = true
tokio.workspace = true
serde.workspace = true
rdkafka = { version = "0.37", features = ["dynamic-linking"], optional = true }

[features]
default = []
# Kafka/Debezium CDC transport (rdkafka dynamic-linking against system
# librdkafka). The SourceAdapter machinery itself is always available.
ingestion-cdc = ["dep:rdkafka"]

[dev-dependencies]
tempfile = "3"
uuid = { workspace = true }
tokio = { workspace = true }
